include: package:flutter_lints/flutter.yaml

# Style lints are informational only. CI runs `flutter analyze --no-fatal-infos`,
# so a missing `const` never fails a build again.
analyzer:
  errors:
    deprecated_member_use: info
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    use_build_context_synchronously: info
