name: Build Wave Lab APK

# Builds a release APK on every push and on demand.
# Download it from the run's "Artifacts" section when the job turns green.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: flutter --version

      # The repo holds only lib/, test/ and pubspec.yaml. The android/ folder is
      # generated here so it always matches the Flutter version doing the build,
      # which is what stops Gradle/AGP version drift from breaking the APK.
      - name: Generate the Android project scaffolding
        run: |
          set -e
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp -r test /tmp/keep/test
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp analysis_options.yaml /tmp/keep/analysis_options.yaml
          flutter create --platforms=android --project-name wave_lab --org com.wavelab .
          rm -rf lib test
          cp -r /tmp/keep/lib lib
          cp -r /tmp/keep/test test
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/analysis_options.yaml analysis_options.yaml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Physics unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Report APK size
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-lab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
